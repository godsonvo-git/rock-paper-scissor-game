<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="icon" href="icon-1.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
   <header>
    <nav>
        <h1 class="logo">ROCK PAPER SCISSOR</h1>
        <div class="links">
            <ul>
            <li><a href="#game">Home</a></li>
            <li><a href="#about">About Project</a></li>
            <li><a href="#contact">Contact Us</a></li>
        </ul>
        </div>
    </nav>
   </header>
   <section id="game" class="game">
        <h1 class="title">Rock paper Scissors</h1>
        <div class="game-buttons">
            <button id="rockBtn">✊</button>
            <button id="paperBtn">✋</button>
            <button id="scissorBtn">✌️</button>
        </div>
        <label class="status-title">It's a tie</label>
        <div class="choice">
            <h1>You<label id="your-choice" for="">✌️</label>, Computer<label for="">✌️</label></h1>
        </div>
        <div class="status">
            <h4>Wins:</h4><label id="win" for="">0</label><h4>Lose:</h4><label id="lose" for="">0</label><h4>Ties:</h4><label id="ties" for="">0</label>
        </div>
        <button id="resetBtn">Reset Scores?</button>
   </section>
   <section id="about" class="about-project">

   </section>
   <section id="contact" class="contact-us">

   </section>
   <footer>
    <h4>&copy Godson V O | Rock Paper Scissor Game 2026</h4>
   </footer>
   </main>

<script src="index.js"></script>
</body>
</html>
